name: Diagnose PKHeX Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android.yml"

jobs:
  diagnose:
    runs-on: windows-2022

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Inspect repository structure
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE

          Write-Host "========================================"
          Write-Host "REPOSITORY ROOT"
          Write-Host "========================================"
          Write-Host $root

          Write-Host ""
          Write-Host "========================================"
          Write-Host "SOLUTION FILES"
          Write-Host "========================================"

          Get-ChildItem $root -Recurse -File |
            Where-Object {
              $_.Extension -in @(".sln", ".slnx")
            } |
            ForEach-Object {
              Write-Host $_.FullName
            }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "PROJECT FILES"
          Write-Host "========================================"

          $projects = Get-ChildItem $root -Recurse -File |
            Where-Object {
              $_.Extension -in @(".csproj", ".fsproj", ".vbproj")
            }

          foreach ($project in $projects) {
            Write-Host $project.FullName
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "ANDROID-RELATED FILES"
          Write-Host "========================================"

          Get-ChildItem $root -Recurse -File |
            Where-Object {
              $_.Name -match 'AndroidManifest\.xml|\.aab$|\.apk$|\.csproj$|\.props$|\.targets$' -or
              $_.Name -match 'MAUI|Xamarin|Android'
            } |
            ForEach-Object {
              Write-Host $_.FullName
            }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "SOLUTION CONTENTS"
          Write-Host "========================================"

          $solution = Join-Path $root "PKHeX.CLI.sln"

          if (Test-Path $solution) {
            Get-Content $solution
          }
          else {
            Write-Host "PKHeX.CLI.sln was not found at the repository root."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "PROJECT DIRECTORY STRUCTURE"
          Write-Host "========================================"

          Get-ChildItem $root -Directory |
            Select-Object -ExpandProperty Name

          Write-Host ""
          Write-Host "Repository inspection completed."
